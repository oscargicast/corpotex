<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corpotex · Reto 7 · Equipo Amaru</title>
<style>
@import url('https://api.fontshare.com/v2/css?f%5B%5D=zodiak@300,400,401,500,700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
:root{
  --paper:#F9F8F6; --cream:#F2F0EC; --ink:#1B2330; --sky:#6B99C6; --deep:#2E5C8A;
  --stone:#A9A79E; --maroon:#5B2230;
  --serif:'Zodiak',Georgia,ui-serif,serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --body:'Inter','Zodiak',-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;font-family:var(--body);min-height:100dvh}
.deck{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 0}

/* ---------- the ground ---------- */
.slide{position:relative;width:100vw;max-width:1920px;aspect-ratio:16/9;background:var(--paper);
  color:var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
  padding:6cqw 7cqw;container-type:inline-size;overflow:hidden}
.slide::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(%23g)' opacity='0.55'/></svg>");
  background-size:240px 240px;opacity:.22;mix-blend-mode:multiply;z-index:3}
.slide>*{position:relative;z-index:1}
.slide.center{align-items:center;justify-content:center;text-align:center}
.slide.ink{background:var(--ink);color:var(--paper)}
.slide.ink::after{opacity:.14}
.slide.cream{background:var(--cream)}
.slide.stone{background:var(--stone);color:var(--paper)}
.slide.skybg{background:var(--sky);color:var(--paper)}
.slide.deep{background:var(--deep);color:var(--paper)}
.slide.stone::after,.slide.skybg::after,.slide.deep::after{opacity:.16}
.slide.stone .markcorner,.slide.skybg .markcorner,.slide.deep .markcorner{color:var(--paper)}

/* ---------- furniture ---------- */
.eyebrow{position:absolute;top:4.4cqw;left:7cqw;font-family:var(--mono);font-size:.95cqw;
  letter-spacing:.22em;text-transform:uppercase;opacity:.55;z-index:2}
.foot{position:absolute;bottom:4.6cqw;left:7cqw;font-family:var(--mono);font-size:.85cqw;
  letter-spacing:.14em;text-transform:uppercase;opacity:.45;margin:0;z-index:2}
.pageno{position:absolute;bottom:4.6cqw;right:7cqw;font-family:var(--mono);font-size:.85cqw;
  letter-spacing:.14em;opacity:.45;z-index:2}
.markcorner{position:absolute;top:4.1cqw;right:7cqw;width:2.4cqw;height:auto;color:var(--ink);z-index:2;opacity:.85}
.slide.ink .markcorner{color:var(--paper)}

/* ---------- type ---------- */
h1{font-family:var(--serif);font-size:5.2cqw;line-height:1.06;font-weight:400;margin:0;letter-spacing:-.005em}
h2{font-family:var(--serif);font-size:4.2cqw;line-height:1.08;font-weight:400;margin:0}
h3{font-family:var(--serif);font-size:2.4cqw;line-height:1.18;font-weight:400;margin:0 0 1cqw}
p{font-size:1.5cqw;line-height:1.62;margin:0;max-width:56ch;opacity:.86}
p.lede{font-size:1.85cqw;line-height:1.55;opacity:.9;max-width:48ch;margin-top:2cqw}
.rule{display:none}
.kicker{font-family:var(--mono);font-size:.95cqw;letter-spacing:.22em;text-transform:uppercase;opacity:.55;margin-bottom:1.6cqw}

/* ---------- title ---------- */
/* double frame on the cover, echoes the website home page */
.slide.title .frame,.slide.title .frame::before{content:"";position:absolute;pointer-events:none;
  border:1px solid rgba(27,35,48,.22);z-index:2}
.slide.title .frame{inset:2.2cqw 2.4cqw}
.slide.title .frame::before{inset:.9cqw;border-color:rgba(27,35,48,.13)}
.slide.title{justify-content:flex-end;padding-bottom:9cqw}
.title .wm{width:26cqw;height:auto;color:var(--ink);display:block;margin-bottom:auto}
.title h1{font-size:6.4cqw;max-width:20ch}
.title .meta{font-family:var(--mono);font-size:1cqw;letter-spacing:.2em;text-transform:uppercase;opacity:.5;margin-top:2.6cqw}

/* ---------- section break ---------- */
.slide.section{justify-content:center}
.section .num{font-family:var(--mono);font-size:1cqw;letter-spacing:.24em;opacity:.5;margin-bottom:1.8cqw}
.section h2{font-size:5.6cqw;max-width:18ch}

/* ---------- statement ---------- */
.statement h2{font-size:4.6cqw;max-width:22ch;line-height:1.14}
.statement .attrib{font-family:var(--mono);font-size:.95cqw;letter-spacing:.18em;text-transform:uppercase;opacity:.5;margin-top:3cqw}

/* ---------- title + two column ---------- */
.slide.titlecols{justify-content:flex-start;padding-top:9.5cqw}
.titlecols h2{font-size:3.6cqw;max-width:20ch}
.titlecols p{margin-top:1.6cqw}
.titlecols .cols{margin-top:auto;margin-bottom:auto}

/* ---------- two column ---------- */
.cols{display:flex;gap:6cqw;width:100%;margin-top:2.6cqw}
.cols>div{flex:1}
.cols h3{font-size:1.9cqw}

/* ---------- bullets ---------- */
.blist{margin:2.6cqw 0 0;padding:0;list-style:none;max-width:62ch}
.blist li{font-size:1.55cqw;line-height:1.55;padding:1.1cqw 0 1.1cqw 3cqw;border-top:1px solid rgba(27,35,48,.14);position:relative}
.blist li:last-child{border-bottom:1px solid rgba(27,35,48,.14)}
.blist li::before{content:"";position:absolute;left:.3cqw;top:1.75cqw;width:.42cqw;height:.42cqw;background:rgba(27,35,48,.4)}
.blist li b{font-weight:600}

/* ---------- numbers ---------- */
.figs{display:flex;gap:5cqw;width:100%;margin-top:3cqw}
.fig{flex:1}
.fig .n{font-family:var(--serif);font-size:7cqw;line-height:1;letter-spacing:-.02em}
.fig .l{font-family:var(--mono);font-size:.9cqw;letter-spacing:.16em;text-transform:uppercase;opacity:.55;margin-top:1.1cqw;display:block}
.fig .d{font-size:1.25cqw;line-height:1.55;opacity:.8;margin-top:.9cqw;max-width:26ch}

/* ---------- image ---------- */
.slide.bleed{padding:0;align-items:stretch;justify-content:stretch}
.bleed img{width:100%;height:100%;object-fit:cover;display:block}
.slide.half{padding:0;flex-direction:row;align-items:stretch}
.half .pane{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6cqw 5cqw}
.half .art{flex:1;overflow:hidden}
.half .art img{width:100%;height:100%;object-fit:cover;display:block}
.placeholder{width:100%;height:100%;background:var(--cream);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:.9cqw;letter-spacing:.2em;text-transform:uppercase;color:var(--stone)}

/* ---------- quote ---------- */
.slide.quote{justify-content:center}
.quote blockquote{font-family:var(--serif);font-style:italic;font-size:3.6cqw;line-height:1.28;margin:0;max-width:24ch}
.quote .who{font-family:var(--mono);font-size:.95cqw;letter-spacing:.18em;text-transform:uppercase;opacity:.5;margin-top:3cqw}

/* ---------- closing ---------- */
.slide.end{align-items:center;justify-content:center;text-align:center}
.end .wm{width:22cqw;height:auto;color:var(--paper);display:block}
.end .line{font-family:var(--serif);font-style:italic;font-size:1.7cqw;opacity:.7;margin-top:3cqw}

/* ---------- icon cards ---------- */



/* ---------- painted objects ---------- */
.obj{position:absolute;z-index:0;pointer-events:none;mix-blend-mode:multiply}

.obj.br{right:6cqw;bottom:5cqw;width:20cqw}
.obj.tr{right:9cqw;top:8cqw;width:16cqw}
.obj.r{right:12cqw;top:50%;transform:translateY(-50%);width:26cqw}
.cols .ci{width:3.4cqw;height:3.4cqw;display:block;color:var(--ink);opacity:.8;margin-bottom:1.4cqw}

/* ---------- sky ---------- */
.slide.sky{padding:0;align-items:center;justify-content:center;text-align:center}
.slide.sky img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.slide.sky h2{color:#fff;font-size:4.4cqw;max-width:18ch;text-shadow:0 .1cqw .7cqw rgba(20,40,65,.3)}
.slide.sky .markcorner{color:#fff;opacity:.9}
/* swap assets/sky.jpg for sky-dusk.jpg or sky-night.jpg for other times of day */
.icards{display:grid;grid-template-columns:repeat(3,1fr);gap:3.4cqw 3cqw;margin-top:3cqw;max-width:78cqw}
.icards .ic{display:block}
.icards .ic svg{width:4.2cqw;height:4.2cqw;display:block;color:var(--ink);opacity:.8}
.icards .ic h4{font-family:var(--serif);font-weight:400;font-size:1.55cqw;line-height:1.2;margin:1.5cqw 0 .6cqw}
.icards .ic p{font-family:var(--mono);font-size:.95cqw;line-height:1.6;opacity:.6;margin:0}

/* ---------- print / PDF export ---------- */
@media print{
  @page{size:13.333in 7.5in;margin:0}
  html,body{background:#fff;margin:0;padding:0}
  .deck{display:block;gap:0;padding:0}
  .slide{width:13.333in;height:7.5in;max-width:none;aspect-ratio:auto;
    break-after:page;page-break-after:always;break-inside:avoid;page-break-inside:avoid;
    margin:0;box-shadow:none}
  .slide:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<style>

.slide.v2 .full{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
.full text{font-family:Inter,system-ui,sans-serif}
.full .eb{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:5px;fill:#1B2330;fill-opacity:.85}
.full .pg{font-family:'JetBrains Mono',monospace;font-size:20px;fill:#1B2330;fill-opacity:.45}
.full .h{font-family:Zodiak,Georgia,serif;font-size:72px;fill:#1B2330}

.full .up{animation:up 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

.full .blinkeye{transform-box:fill-box;transform-origin:center;animation:be 4s infinite}@keyframes be{0%,92%,100%{transform:none}95%{transform:scaleY(.1)}}

/* slide 3: everything visible in low relief, lit stage by stage */

.full .d1{animation-name:lit1}.full .d2{animation-name:lit2}.full .d3{animation-name:lit3}.full .d4{animation-name:lit4}.full .d5,.full .d6{animation-name:lit5}

/* antes / después */
.full .stress{fill:#5B2230;fill-opacity:.1;animation:st 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes st{0%,100%{transform:scale(1);fill-opacity:.08}50%{transform:scale(1.06);fill-opacity:.2}}
