name: corpotex

# Los puertos se publican solo en 127.0.0.1: en el wifi del evento nadie más
# entra a Postgres, Redis, Django o Next.js. El tunnel corre en el host y llega
# igual a localhost. Dentro de compose los servicios se hablan por nombre.

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgres://corpotex:${POSTGRES_PASSWORD:-corpotex}@postgres:5432/corpotex
    REDIS_URL: redis://redis:6379/0
    CLAUDE_CONFIG_DIR: /app/.agent/config
  volumes:
    - ./backend:/app
    - agent-home:/app/.agent
    - media:/app/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: corpotex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corpotex}
      POSTGRES_DB: corpotex
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18 keeps its data in a versioned subdirectory; the image refuses a mount at the old /data path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpotex -d corpotex"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"

  celery-worker:
    <<: *backend
    command: celery -A config worker -Q turns,periodic,style -c 5 --prefetch-multiplier 1 -l info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  celery-beat:
    <<: *backend
    command: celery -A config beat -l info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  frontend:
    build: ./frontend
    command: pnpm dev
    environment:
      API_URL: http://web:8000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - web

volumes:
  postgres-data:
  agent-home:
  media:
  frontend-node-modules:
