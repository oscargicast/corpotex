[project]
name = "corpotex-backend"
version = "0.1.0"
description = "Corpotex: supplier and workshop management with a WhatsApp agent"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework>=3.18,<3.19",
    "drf-spectacular>=0.30,<0.31",
    "django-cors-headers>=4.9,<5",
    "django-environ>=0.14,<0.15",
    "psycopg[binary]>=3.3,<3.4",
    "celery[redis]>=5.6,<5.7",
    "redis>=8.1,<9",
    "pydantic>=2.14,<3",
    "requests>=2.34,<3",
    "claude-agent-sdk>=0.2.165,<0.3",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-django>=4.11",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
